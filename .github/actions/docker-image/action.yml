name: Build the development image
description: >
  開発用の Docker イメージ (Dockerfile の dev ステージ) を, thermon-dev:latest としてビルドする.
  docker compose のサービスは, このイメージを使う. レイヤーを GitHub Actions のキャッシュに
  保存するので, 2 回目からは, 短時間で終わる.
  使う前に, actions/checkout を実行しておくこと.

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build the image (with layer cache)
      uses: docker/build-push-action@v7
      env:
        # ビルドの記録 (<owner>~<repo>~XXXXXX.dockerbuild) をアーティファクトに保存しない
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: .
        file: ./Dockerfile
        target: dev
        load: true
        push: false
        tags: thermon-dev:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true
